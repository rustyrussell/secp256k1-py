[build-system]
requires = ["setuptools>=70.1", "cffi>=1.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secp256k1"
version = "0.14.0"
description = "FFI bindings to libsecp256k1"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Ludvig Broberg", email = "lud@tutanota.com"}
]
maintainers = [
    {name = "Rusty Russell", email = "rusty@rustcorp.com.au"}
]
keywords = ["secp256k1", "crypto", "elliptic curves", "bitcoin", "ethereum"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cffi>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/rustyrussell/secp256k1-py"
Repository = "https://github.com/rustyrussell/secp256k1-py"

[tool.cibuildwheel]
# Build CPython 3.9-3.13
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"

# Skip PyPy (CFFI builds are complex) and 32-bit builds (low demand)
skip = "pp* *-win32 *-manylinux_i686 *-musllinux_i686"

# Use the build frontend (PEP 517)
build-frontend = "build"

# Ensure setuptools is available (required by CFFI on Python 3.12+)
before-build = "pip install setuptools"

# Test configuration
test-requires = ["pytest", "setuptools"]
test-command = "pytest {project}/tests -v"

[tool.cibuildwheel.linux]
# Clean build directory before building
before-all = "rm -rf build .eggs"

[tool.cibuildwheel.macos]
# Clean build directory before building
before-all = "rm -rf build .eggs"

[tool.cibuildwheel.windows]
# Skip tests on ARM64 (no ARM64 Python available on CI runners yet)
test-skip = "*-win_arm64"

# Clean build directory before building
before-all = "if exist build rmdir /s /q build && if exist .eggs rmdir /s /q .eggs"
