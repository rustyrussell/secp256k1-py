name: Python Library Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config libffi-dev

    - name: Sync dependencies
      run: |
        uv sync --dev --no-editable

    - name: Lint with flake8
      run: |
        uv run flake8 . --count --show-source --statistics --exclude=libsecp256k1,.venv,.eggs,build

    - name: Test with pytest
      run: |
        uv run pytest tests/ -v
